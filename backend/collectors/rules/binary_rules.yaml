  - id: p256_prime
    algorithm: ECDSA
    note: "NIST P-256 field prime"
    hex:
      - "ffffffff00000001000000000000000000000000ffffffffffffffffffffffff"
      - "ffffffffffffffffffffffff00000000000000000000000001000000ffffffff"
