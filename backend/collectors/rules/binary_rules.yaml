# Binary scanner rules (collectors/binary_scanner.py). Data, not code: add a
# rule here and the scanner picks it up. Confidence per layer is set in
# `layers`; each layer's weight reflects how specific its evidence is.

layers:
  linked_library: 0.80     # DT_NEEDED / PE import / Mach-O dylib names
  symbol: 0.85             # imported or exported function names
  version_banner: 0.70     # "OpenSSL 3.0.18" etc. in read-only data
  cng_algorithm_id: 0.70   # UTF-16 CNG algorithm ids next to BCrypt imports
  constant: 0.60           # byte-exact tables; data can look like code
  jar_constant_pool: 0.75  # algorithm strings in .class files that call a JCA API
  embedded_certificate: 0.90  # a parsed X.509 certificate
  embedded_private_key: 0.70  # a PEM private-key marker (body never read)
  pqc_table: 0.90          # ML-KEM / ML-DSA NTT twiddle table, derived from FIPS 203/204 parameters

# Imported/exported names. First matching rule wins, so specific before general.
# `library` links the symbol to a crypto_libraries.yaml entry.
symbols:
  # Randomness only: not a cryptographic-algorithm finding.
  - {pattern: '^(BCryptGenRandom|RAND_bytes|RAND_poll|randombytes_buf)$', algorithm: null, library: null}
  - {pattern: '^EVP_des_ede3', algorithm: 3DES, library: openssl}
  - {pattern: '^EVP_des_', algorithm: DES, library: openssl}
  - {pattern: '^EVP_md5$', algorithm: MD5, library: openssl}
  - {pattern: '^EVP_sha1$', algorithm: SHA-1, library: openssl}
  - {pattern: '^EVP_rc4', algorithm: RC4, library: openssl}
  - {pattern: '^EVP_bf_', algorithm: Blowfish, library: openssl}
  - {pattern: '^EVP_aes_128_', algorithm: AES-128, library: openssl}
  - {pattern: '^EVP_aes_256_', algorithm: AES-256, library: openssl}
  - {pattern: '^EVP_chacha20', algorithm: ChaCha20, library: openssl}
  - {pattern: '^(RSA_|EVP_PKEY_get1_RSA|EVP_PKEY_assign_RSA|PEM_read_bio_RSA)', algorithm: RSA, library: openssl}
  - {pattern: '^(ECDSA_|EC_KEY_|EVP_PKEY_get1_EC_KEY)', algorithm: ECDSA, library: openssl}
  - {pattern: '^ECDH_', algorithm: ECDH, library: openssl}
  - {pattern: '^DH_', algorithm: DH, library: openssl}
  - {pattern: '^DSA_', algorithm: DSA, library: openssl}
  - {pattern: '^DES_', algorithm: DES, library: openssl}
  - {pattern: '^MD5(_|$)', algorithm: MD5, library: openssl}
  - {pattern: '^SHA1(_|$)', algorithm: SHA-1, library: openssl}
  - {pattern: '^RC4(_|$)', algorithm: RC4, library: openssl}
  - {pattern: '^(SSL_|TLS_|EVP_|X509_|PEM_|OPENSSL_)', algorithm: null, library: openssl}
  - {pattern: '^mbedtls_rsa_', algorithm: RSA, library: mbedtls}
  - {pattern: '^mbedtls_ecdsa_', algorithm: ECDSA, library: mbedtls}
  - {pattern: '^mbedtls_ecdh_', algorithm: ECDH, library: mbedtls}
  - {pattern: '^mbedtls_des3_', algorithm: 3DES, library: mbedtls}
  - {pattern: '^mbedtls_des_', algorithm: DES, library: mbedtls}
  - {pattern: '^mbedtls_md5', algorithm: MD5, library: mbedtls}
  - {pattern: '^mbedtls_sha1', algorithm: SHA-1, library: mbedtls}
  - {pattern: '^mbedtls_', algorithm: null, library: mbedtls}
  - {pattern: '^wc_(Rsa|MakeRsaKey|InitRsaKey)', algorithm: RSA, library: wolfssl}
  - {pattern: '^wc_ecc_', algorithm: ECDSA, library: wolfssl}
  - {pattern: '^wc_Des3_', algorithm: 3DES, library: wolfssl}
  - {pattern: '^wc_Des_', algorithm: DES, library: wolfssl}
  - {pattern: '^wc_(InitMd5|Md5)', algorithm: MD5, library: wolfssl}
  - {pattern: '^wc_(InitSha|Sha)(Update|Final)?$', algorithm: SHA-1, library: wolfssl}
  - {pattern: '^wc_(MlKem|KyberKey)', algorithm: ML-KEM-768, library: wolfssl}
  - {pattern: '^(wc_|wolfSSL_)', algorithm: null, library: wolfssl}
  - {pattern: '^crypto_(box|kx|scalarmult)', algorithm: X25519, library: libsodium}
  - {pattern: '^crypto_sign', algorithm: Ed25519, library: libsodium}
  - {pattern: '^(sodium_|crypto_)', algorithm: null, library: libsodium}
  - {pattern: '^gnutls_', algorithm: null, library: gnutls}
  - {pattern: '^OQS_', algorithm: null, library: liboqs}
  - {pattern: '^(BCrypt|NCrypt)', algorithm: null, library: windows-cng}
  - {pattern: '^Crypt(AcquireContext|GenKey|Encrypt|Decrypt|SignHash|CreateHash|ImportKey|ExportKey|DeriveKey)', algorithm: null, library: windows-capi}
  - {pattern: '^(SecKey|SecCertificate|SecTrust)', algorithm: null, library: apple-security}
  - {pattern: '^CC(Crypt|_MD5|_SHA1|Hmac)', algorithm: null, library: apple-security}

# Library file names that only count when a crypto symbol is actually imported
# from them. advapi32 and crypt32 are linked by almost every Windows program.
require_symbol_for: [advapi32.dll, crypt32.dll, bcrypt.dll, ncrypt.dll]

# Go binaries keep package-qualified function names even when stripped.
go_packages:
  - {pattern: 'crypto/rsa\.', algorithm: RSA}
  - {pattern: 'crypto/ecdsa\.', algorithm: ECDSA}
  - {pattern: 'crypto/ecdh\.', algorithm: ECDH}
  - {pattern: 'crypto/ed25519\.', algorithm: Ed25519}
  - {pattern: 'crypto/dsa\.', algorithm: DSA}
  - {pattern: 'crypto/des\.', algorithm: DES}
  - {pattern: 'crypto/rc4\.', algorithm: RC4}
  - {pattern: 'crypto/md5\.', algorithm: MD5}
  - {pattern: 'crypto/sha1\.', algorithm: SHA-1}
  - {pattern: 'crypto/mlkem\.', algorithm: ML-KEM-768}

# CNG algorithm identifiers (UTF-16LE in the binary). Only read when the binary
# imports BCrypt*/NCrypt*, because short UTF-16 strings are common elsewhere.
cng_algorithm_ids:
  - {id: 'ECDSA_P256', algorithm: ECDSA}
  - {id: 'ECDSA_P384', algorithm: ECDSA}
  - {id: 'ECDH_P256', algorithm: ECDH}
  - {id: 'ECDH_P384', algorithm: ECDH}
  - {id: 'RSA_SIGN', algorithm: RSA}
  - {id: '3DES', algorithm: 3DES}
  - {id: 'ML-KEM', algorithm: ML-KEM-768}
  - {id: 'ML-DSA', algorithm: ML-DSA-65}

# IANA TLS cipher-suite names found as strings in application binaries.
cipher_suite_pattern: 'TLS_[A-Z0-9]+(?:_[A-Z0-9]+)*_WITH_[A-Z0-9]+(?:_[A-Z0-9]+)*'

# JCA algorithm strings. Matched only in classes that reference a JCA API class.
jca_api_classes:
  - javax/crypto/Cipher
  - javax/crypto/KeyAgreement
  - javax/crypto/KeyGenerator
  - javax/crypto/Mac
  - javax/crypto/SecretKeyFactory
  - java/security/KeyPairGenerator
  - java/security/KeyFactory
  - java/security/Signature
  - java/security/MessageDigest
jca_strings:
  - {pattern: '^(AES|DES|DESede|TripleDES|Blowfish|RC4|ARCFOUR|ChaCha20|RSA)(/([A-Za-z0-9]+)/([A-Za-z0-9]+))?$', kind: transformation}
  - {pattern: '^(MD5|SHA1|SHA256|SHA384|SHA512)with(RSA|ECDSA|DSA)$', kind: signature}
  - {pattern: '^(RSASSA-PSS|Ed25519|Ed448|EdDSA|ECDSA|DSA)$', kind: signature}
  - {pattern: '^(EC|ECDH|DH|DiffieHellman|X25519|X448|XDH)$', kind: key_agreement}
  - {pattern: '^(MD5|SHA-1|SHA1|SHA-256|SHA-512)$', kind: digest}
  - {pattern: '^(ML-KEM(-512|-768|-1024)?|ML-DSA(-44|-65|-87)?|SLH-DSA.*|Kyber\d*|Dilithium\d*)$', kind: pqc}

# PEM markers. Certificates are parsed (public data); private keys never are.
pem_certificate: '-----BEGIN CERTIFICATE-----'
pem_private_key: '-----BEGIN ((?:RSA|EC|DSA|ENCRYPTED|OPENSSH) )?PRIVATE KEY-----'

# Byte-exact constant tables, each in the byte orders implementations use.
constants:
  - id: aes_sbox
    algorithm: AES
    note: "AES forward S-box (256 bytes)"
    hex:
      - ""
  - id: aes_inv_sbox
    algorithm: AES
    note: "AES inverse S-box (256 bytes)"
    hex:
      - ""
  - id: aes_te0
    algorithm: AES
    note: "AES T-table Te0, first 8 words"
    hex:
      - "c66363a5f87c7c84ee777799f67b7b8dfff2f20dd66b6bbdde6f6fb191c5c554"
      - "a56363c6847c7cf8997777ee8d7b7bf60df2f2ffbd6b6bd6b16f6fde54c5c591"
  - id: sha256_k
    algorithm: SHA-256
    note: "SHA-256 round constants K[0..7]"
    hex:
