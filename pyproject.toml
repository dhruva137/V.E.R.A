[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "vera-cbom"
version = "0.1.0"
description = "V.E.R.A.: certified cryptographic discovery that produces a CycloneDX 1.7 CBOM, including from stripped binaries."
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-TBA"
authors = [{ name = "Dhruva P Gowda" }]
keywords = ["cbom", "cryptography", "post-quantum", "cyclonedx", "crypto-agility", "binary-analysis"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Information Technology",
  "License :: Other/Proprietary License",
  "Programming Language :: Python :: 3",
  "Topic :: Security :: Cryptography",
]
dependencies = [
  "fastapi>=0.115.0",
  "pydantic>=2.0.0",
  "cryptography>=44.0.0",
  "pyOpenSSL>=25.0.0",
  "numpy>=2.0.0",
  "scipy>=1.14.0",
  "PyYAML>=6.0",
  "lief>=0.15",
  "pyelftools>=0.31",
  "capstone>=5.0",
  "scikit-learn>=1.6.1,<1.7",  # the bundled detector was pickled with 1.6.1
  "tree-sitter>=0.25",
  "tree-sitter-language-pack>=0.9",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.0",
  "jsonschema>=4.0",
  "fastjsonschema>=2.19",
  "joblib>=1.3",
  "reportlab>=4.2",
  "python-multipart>=0.0.20",
]

[project.optional-dependencies]
server = ["uvicorn[standard]>=0.34.0"]
mcp = ["mcp>=1.2.0"]
test = ["pytest>=8.0.0", "pytest-asyncio", "hypothesis"]
all = ["vera-cbom[server,mcp]"]

[project.scripts]
vera = "vera_cbom.cli:main"

[project.urls]
Homepage = "https://papertoanything.com/products/vera/"
Repository = "https://github.com/dhruva137/V.E.R.A"

[tool.hatch.build.targets.wheel]
packages = ["src/vera_cbom"]

[tool.hatch.build.targets.wheel.force-include]
"backend/adapters" = "vera_cbom/_backend/adapters"
"backend/api" = "vera_cbom/_backend/api"
"backend/collectors" = "vera_cbom/_backend/collectors"
"backend/engine" = "vera_cbom/_backend/engine"
"backend/models" = "vera_cbom/_backend/models"
"backend/report" = "vera_cbom/_backend/report"
"backend/main.py" = "vera_cbom/_backend/main.py"
"backend/store.py" = "vera_cbom/_backend/store.py"
"backend/mcp_server.py" = "vera_cbom/_backend/mcp_server.py"
"backend/data/announcements.json" = "vera_cbom/_backend/data/announcements.json"
"backend/data/targets.json" = "vera_cbom/_backend/data/targets.json"
"bench/pqc_bench.json" = "vera_cbom/bench/pqc_bench.json"

[tool.hatch.build.targets.sdist]
include = ["src", "backend", "bench/pqc_bench.json", "README.md", "LICENSE", "NOTICE.md", "pyproject.toml"]
exclude = ["backend/tests", "backend/data/*.db", "backend/data/signing", "**/__pycache__", "**/*.pyc"]
